spring:
  # 告诉 Spring Boot 默认加载 application-dev.yaml
  profiles:
    active: dev

  application:
    name: ai-coding-platform

  datasource:
    # 采用 ${变量名} 注入，可以设置默认值防止报错，如 ${变量名:默认值}
    url: jdbc:mysql://127.0.0.1:3306/${db.name:aicoding}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:} # ${github.client-secret}
            scope:
              - user:email
              - repo
              - read:user
            # {baseUrl} 和 {registrationId} 是 Spring 底层占位符，保持原样
            redirect-uri: ${GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}} # ${github.redirect-uri:{baseUrl}/login/oauth2/code/{registrationId}}
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user

server:
  forward-headers-strategy: framework

app:
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:3000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://sulr.cc.cd,https://sulr.cc.cd}

minio:
  endpoint: ${minio.url}
  access-key: ${minio.ak}
  secret-key: ${minio.sk}
  bucket-name: ${minio.bucket}

workspace:
  base-path: ${WORKSPACE_BASE_PATH:/var/aicode/workspace}
  backup-cron: "0 */30 * * * *"

ai:
  openai:
    api-key: ${ai.api-key}
    model: ${ai.model:deepseek-ai/DeepSeek-V4-Flash}
    base-url: ${ai.base-url:https://api.siliconflow.cn/v1}
    embedding-api-key: ${ai.embedding-api-key:}
    embedding-base-url: ${ai.embedding-base-url:}
    embedding-model: ${ai.embedding-model:Qwen/Qwen3-VL-Embedding-8B}
    embedding-dimensions: ${ai.embedding-dimensions:4096}
  rag:
    store: ${AI_RAG_STORE:in-memory}
    max-results: 6
    min-score: 0.65
    dense-candidates: 18
    symbol-candidates: 18
    rrf-k: 60
    dense-weight: 1.0
    symbol-weight: 1.2
    large-file-lines: 400
    chunk-size-lines: 200
    chunk-overlap-lines: 30
    embedding-batch-size: 64
  milvus:
    dimension: ${ai.milvus.dimension:4096}
  llm:
    max-concurrency: 3
    request-timeout: 60
    retry:
      max-attempts: 3
      backoff-factor: 2.0
      initial-delay: 1000ms
  chat-memory:
    max-messages: 10

guardrails:
  enabled: true
  patterns: ".*api[_-]?key.*,.*password.*,.*secret.*,.*token.*"
